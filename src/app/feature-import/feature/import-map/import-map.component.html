<ion-header>
  <ion-toolbar>
    <ion-buttons slot="end">
      <ion-button (click)="okClick()">Close</ion-button>
    </ion-buttons>
    <ion-title>Import map</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list [formGroup]="form">
    <ion-item button detail="false">
      <ion-input type="file" (change)="onFileChange($any($event.target))" accept=".json" placeholder="Select a file"
        label="Style file" labelPlacement="stacked"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input placeholder="Enter a name" formControlName="name" label="Name" labelPlacement="stacked"></ion-input>
    </ion-item>
    <ion-item lines="none">
      <ion-button shape="round" [disabled]="form.invalid" (click)="importClick()" class="btn-import">Import</ion-button>
    </ion-item>
  </ion-list>
</ion-content>
